<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento &amp; OS — MVP óptica domiciliar</title>
<style>
  :root{
    --bg:#f3f5f4; --surf:#ffffff; --surf2:#f8faf9;
    --ink:#1a1e22; --mut:#697076; --dim:#98a0a5; --line:#e3e7e5;
    --acc:#0e7c6b; --acc-d:#0a5d50; --acc-bg:#e5f1ee;
    --err:#b84a3d; --err-bg:#fbeceb;
    --blue:#2b6cb0; --amber:#b7791f; --gray:#727b82;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  #printDoc{display:none}
  .app{max-width:920px;margin:0 auto;padding:0 18px 70px}
  /* topbar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .brand{display:flex;flex-direction:column}
  .brand .k{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
  .brand h1{font-size:17px;font-weight:600;margin:1px 0 0;letter-spacing:-.01em}
  .who{font-size:12px;color:var(--mut);text-align:right}
  .who b{color:var(--ink);font-weight:600}
  .tabs{display:flex;gap:2px;margin:14px 0 22px;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:4px}
  .tabs button{flex:1;background:none;border:none;padding:9px 8px;border-radius:8px;font-family:var(--sans);
    font-size:13px;font-weight:500;color:var(--mut);cursor:pointer}
  .tabs button.on{background:var(--acc);color:#fff}
  /* cards */
  .card{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-bottom:14px}
  .card h2{font-size:14px;font-weight:600;margin:0 0 3px}
  .card .hint{font-size:12px;color:var(--mut);margin:0 0 15px}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:500}
  input,select,textarea{background:var(--surf2);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:9px 11px;font-size:14px;font-family:var(--sans);width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:#fff}
  input.num{font-family:var(--mono);text-align:center}
  input.bad{border-color:var(--err);background:var(--err-bg)}
  .fe{font-size:11px;color:var(--err);min-height:0}
  /* receita table */
  .rx{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .rx table{width:100%;border-collapse:collapse}
  .rx th,.rx td{padding:0;text-align:center}
  .rx thead th{background:var(--surf2);font-size:11px;font-weight:600;color:var(--mut);
    text-transform:uppercase;letter-spacing:.05em;padding:9px 4px;border-bottom:1px solid var(--line)}
  .rx tbody th{background:var(--surf2);width:52px;font-family:var(--mono);font-size:13px;color:var(--acc-d);
    border-right:1px solid var(--line);font-weight:600}
  .rx td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .rx td:last-child,.rx th:last-child{border-right:none}
  .rx tbody tr:last-child td,.rx tbody tr:last-child th{border-bottom:none}
  .rx input{border:none;border-radius:0;background:transparent;text-align:center;font-family:var(--mono);padding:11px 4px}
  .rx input:focus{background:var(--acc-bg)}
  .rx input.bad{background:var(--err-bg)}
  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:var(--surf2);border-radius:20px;padding:6px 13px;
    font-size:12px;color:var(--mut);cursor:pointer;user-select:none}
  .chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc-d);font-weight:600}
  /* consent */
  .consent{display:flex;gap:11px;align-items:flex-start;background:var(--acc-bg);
    border:1px solid #cfe5e0;border-radius:10px;padding:13px 15px}
  .consent input{width:18px;height:18px;margin-top:1px;flex:none;accent-color:var(--acc)}
  .consent .t{font-size:12px;color:var(--acc-d);line-height:1.55}
  /* actions */
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .btn{border:none;border-radius:9px;padding:11px 20px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:var(--sans)}
  .btn.pri{background:var(--acc);color:#fff}
  .btn.pri:hover{background:var(--acc-d)}
  .btn.sec{background:var(--surf);border:1px solid var(--line);color:var(--ink)}
  .btn.sec:hover{border-color:var(--acc)}
  .btn.ghost{background:none;border:none;color:var(--mut)}
  /* ordens list */
  .ordens{display:flex;flex-direction:column;gap:10px}
  .ord{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center}
  .ord .id{font-family:var(--mono);font-size:12px;color:var(--acc-d)}
  .ord .id .loc{color:var(--dim)}
  .ord .nm{font-size:15px;font-weight:600;margin:2px 0 0}
  .ord .meta{font-size:12px;color:var(--mut);margin:2px 0 0}
  .ord .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  select.status{font-family:var(--mono);font-size:11px;font-weight:600;padding:6px 8px;width:auto;text-transform:uppercase}
  .status[data-s="enviado"]{color:var(--blue)} .status[data-s="confeccao"]{color:var(--amber)}
  .status[data-s="pronto"]{color:var(--acc)} .status[data-s="entregue"]{color:var(--gray)}
  .icobtn{background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;
    font-size:12px;color:var(--mut);cursor:pointer;font-weight:500}
  .icobtn:hover{border-color:var(--acc);color:var(--acc-d)}
  .icobtn.del:hover{border-color:var(--err);color:var(--err)}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:32px;text-align:center;color:var(--mut);font-size:14px}
  .search{margin-bottom:14px}
  /* transpose */
  .tout{font-family:var(--mono);font-size:15px;background:var(--acc-bg);border:1px solid #cfe5e0;
    border-radius:10px;padding:14px 16px;color:var(--acc-d);margin-top:14px;display:none}
  .tout.show{display:block} .tout b{color:var(--ink)}
  /* toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:500;
    opacity:0;pointer-events:none;transition:.28s;z-index:20}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .lgpd-note{font-size:11px;color:var(--dim);line-height:1.6;margin-top:10px}
  /* print doc */
  #printDoc{color:#000;font-family:var(--sans)}
  .doc{width:23cm;padding:.7cm .9cm;border:1px solid #000}
  .doc .dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px}
  .doc .cnpj{font-size:20px;font-weight:700;letter-spacing:.02em}
  .doc .cnpj small{display:block;font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase}
  .doc .nums{text-align:right;font-family:var(--mono);font-size:12px;line-height:1.5}
  .doc .nums b{font-size:15px}
  .doc h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:12px 0 5px;border-bottom:1px solid #999;padding-bottom:2px}
  .doc .cli{font-size:13px;line-height:1.5}
  .doc .rxp{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px;margin-top:3px}
  .doc .rxp th,.doc .rxp td{border:1px solid #000;padding:5px 8px;text-align:center}
  .doc .rxp thead th{background:#eee;font-size:10px;text-transform:uppercase}
  .doc .prod{font-size:12px;line-height:1.6}
  .doc .foot{margin-top:14px;display:flex;justify-content:space-between;font-size:11px}
  .doc .sign{margin-top:26px;border-top:1px solid #000;width:7cm;text-align:center;font-size:10px;padding-top:3px}
  @media print{
    .app{display:none} #printDoc{display:block}
    @page{margin:1cm}
  }
</style>

<div class="app" id="app">
  <div class="top">
    <div class="brand"><span class="k">NIT · óptica domiciliar</span><h1>Atendimento &amp; OS</h1></div>
    <div class="who"><span id="whoName">—</span><br><span id="whoCnpj" class="dim"></span></div>
  </div>

  <div class="tabs" id="tabs">
    <button data-t="atend" class="on">Atendimento</button>
    <button data-t="ordens">Ordens</button>
    <button data-t="ferr">Ferramentas</button>
    <button data-t="cfg">Ajustes</button>
  </div>

  <div id="view"></div>
</div>

<div id="printDoc"></div>
<div id="toast"></div>

<script>
const KEY="nit_optica_os";
const TIPOS=["visão simples","multifocal","bifocal"];
const INDICES=["resina 1.50","resina 1.56","policarbonato","trivex","resina 1.61","resina 1.67","resina 1.74","cristal"];
const TRATAM=["AR","fotossensível","blue light","hidrofóbico","UV"];
const STATUS=[["enviado","enviado ao lab"],["confeccao","em confecção"],["pronto","pronto"],["entregue","entregue"]];
let S=null, editingId=null, saveT=null;

/* ---------- persistence ---------- */
function defaults(){return{config:{nome:"",cnpj:"",localStart:1},clientes:[],ordens:[],counters:{global:1,local:1}};}
async function load(){
  try{const r=await window.storage.get(KEY,false); if(r&&r.value) S=JSON.parse(r.value);}catch(e){S=null;}
  if(!S||typeof S!=="object") S=defaults();
  S.config=Object.assign(defaults().config,S.config||{});
  S.clientes=S.clientes||[]; S.ordens=S.ordens||[];
  S.counters=Object.assign({global:1,local:1},S.counters||{});
}
function persist(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{try{await window.storage.set(KEY,JSON.stringify(S),false);}catch(e){}},150);
}
function uid(){return Math.random().toString(36).slice(2,9);}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function fmtG(n){return "OS-"+String(n).padStart(6,"0");}
function today(){return new Date().toISOString().slice(0,10);}
function brDate(iso){if(!iso)return"";const[y,m,d]=iso.split("-");return d+"/"+m+"/"+y;}

/* ---------- navigation ---------- */
let current="atend";
function nav(t){current=t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));draw();}

/* ---------- receita helpers ---------- */
const RX_FIELDS=["esf","cil","eixo","ad"];
function blankRx(){return{od:{esf:"",cil:"",eixo:"",ad:""},oe:{esf:"",cil:"",eixo:"",ad:""}};}
function validRx(rx){
  const errs={};
  for(const eye of ["od","oe"]){
    const e=rx[eye];
    for(const f of ["esf","cil","ad"]){
      if(e[f]!==""&&isNaN(parseFloat(e[f]))) errs[eye+f]="número";
      else if(f!=="ad"&&e[f]!==""&&Math.abs(parseFloat(e[f]))>30) errs[eye+f]="fora de faixa";
      else if(f==="ad"&&e[f]!==""&&(parseFloat(e[f])<0||parseFloat(e[f])>4)) errs[eye+f]="0–4";
    }
    if(e.eixo!==""){
      const x=parseInt(e.eixo);
      if(isNaN(x)||x<0||x>180) errs[eye+"eixo"]="0–180";
    }
    if(e.cil!==""&&parseFloat(e.cil)!==0&&e.eixo==="") errs[eye+"eixo"]="obrigatório com cil.";
  }
  return errs;
}

/* ---------- ATENDIMENTO ---------- */
let form=null;
function newForm(){return{clienteId:null,nome:"",contato:"",endereco:"",rx:blankRx(),
  medidas:{dnpOD:"",dnpOE:"",altOD:"",altOE:""},
  produto:{armacao:"",tipo:"",indice:"",tratam:[],obs:""},valor:"",status:"enviado",consent:false};}

function loadOrdemToForm(o){
  const c=S.clientes.find(x=>x.id===o.clienteId)||{};
  form={clienteId:o.clienteId,nome:c.nome||"",contato:c.contato||"",endereco:c.endereco||"",
    rx:JSON.parse(JSON.stringify(o.receita)),medidas:Object.assign({},o.medidas),
    produto:Object.assign({tratam:[]},o.produto),valor:o.valor||"",status:o.status,consent:true};
  editingId=o.id;nav("atend");
}

function drawAtend(){
  if(!form) form=newForm();
  const dl=S.clientes.map(c=>`<option value="${esc(c.nome)}">`).join("");
  const v=document.getElementById("view");
  v.innerHTML=`
  <div class="card">
    <h2>Cliente</h2>
    <p class="hint">${editingId?"Editando "+fmtG(S.ordens.find(o=>o.id===editingId).osGlobal):"Novo atendimento. Digite um nome já atendido para reaproveitar os dados."}</p>
    <div class="grid g2">
      <label class="f">Nome<input id="f_nome" list="cli_dl" value="${esc(form.nome)}" placeholder="Nome do cliente"></label>
      <label class="f">Contato<input id="f_contato" value="${esc(form.contato)}" placeholder="Telefone / WhatsApp"></label>
    </div>
    <datalist id="cli_dl">${dl}</datalist>
    <label class="f" style="margin-top:12px">Endereço do atendimento<input id="f_end" value="${esc(form.endereco)}" placeholder="Onde o atendimento aconteceu"></label>
    <div id="histBox"></div>
  </div>

  <div class="card">
    <h2>Receita</h2>
    <p class="hint">Valores em dioptria. Eixo 0–180. A faixa é validada para evitar erro de registro.</p>
    <div class="rx"><table><thead><tr>
      <th></th><th>Esférico</th><th>Cilíndrico</th><th>Eixo</th><th>Adição</th></tr></thead>
      <tbody>${["od","oe"].map(eye=>`<tr><th>${eye.toUpperCase()}</th>${RX_FIELDS.map(f=>{
        const ph=f==="eixo"?"0–180":(f==="ad"?"+0.00":"±0.00");
        return `<td><input class="num rxi" data-eye="${eye}" data-f="${f}" value="${esc(form.rx[eye][f])}" placeholder="${ph}" inputmode="decimal"></td>`;
      }).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="fe" id="rxErr"></p>
  </div>

  <div class="card">
    <h2>Medidas</h2>
    <div class="grid g2">
      <label class="f">DNP — OD (mm)<input class="num md" data-k="dnpOD" value="${esc(form.medidas.dnpOD)}" inputmode="decimal"></label>
      <label class="f">DNP — OE (mm)<input class="num md" data-k="dnpOE" value="${esc(form.medidas.dnpOE)}" inputmode="decimal"></label>
      <label class="f">Altura óptica — OD (mm)<input class="num md" data-k="altOD" value="${esc(form.medidas.altOD)}" inputmode="decimal"></label>
      <label class="f">Altura óptica — OE (mm)<input class="num md" data-k="altOE" value="${esc(form.medidas.altOE)}" inputmode="decimal"></label>
    </div>
  </div>

  <div class="card">
    <h2>Produto</h2>
    <div class="grid g2">
      <label class="f">Armação<input id="p_arm" value="${esc(form.produto.armacao)}" placeholder="Marca / modelo"></label>
      <label class="f">Tipo de lente<select id="p_tipo"><option value="">—</option>${TIPOS.map(t=>`<option ${form.produto.tipo===t?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="f">Material / índice<select id="p_ind"><option value="">—</option>${INDICES.map(t=>`<option ${form.produto.indice===t?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="f">Valor (opcional, p/ recibo)<input id="p_valor" value="${esc(form.valor)}" placeholder="R$" inputmode="decimal"></label>
    </div>
    <p class="hint" style="margin:15px 0 7px">Tratamentos</p>
    <div class="chips" id="tratChips">${TRATAM.map(t=>`<span class="chip ${form.produto.tratam.includes(t)?"on":""}" data-t="${t}">${t}</span>`).join("")}</div>
    <label class="f" style="margin-top:14px">Observações<textarea id="p_obs" rows="2">${esc(form.produto.obs)}</textarea></label>
  </div>

  <div class="card">
    <h2>Consentimento (LGPD)</h2>
    <label class="consent">
      <input type="checkbox" id="consentChk" ${form.consent?"checked":""}>
      <span class="t">O cliente autoriza o registro da receita para confecção da lente e histórico de atendimento, e o envio ao laboratório escolhido. Dado sensível de saúde — tratado só para essa finalidade, revogável a qualquer momento.</span>
    </label>
    <p class="lgpd-note">Você é o Controlador dos dados; a ferramenta apenas processa. Guardamos só o necessário para a OS e o histórico.</p>
    <div class="actions" style="margin-top:16px">
      <button class="btn pri" id="saveBtn">${editingId?"Salvar alterações":"Salvar OS"}</button>
      <button class="btn sec" id="savePrintBtn">Salvar e imprimir</button>
      ${editingId?'<button class="btn ghost" id="cancelEdit">Cancelar edição</button>':''}
    </div>
  </div>`;

  // wire cliente
  const nameEl=document.getElementById("f_nome");
  nameEl.addEventListener("input",e=>{form.nome=e.target.value;});
  nameEl.addEventListener("change",e=>{ const m=S.clientes.find(c=>c.nome.toLowerCase()===e.target.value.trim().toLowerCase());
    if(m){form.clienteId=m.id;form.contato=m.contato;form.endereco=m.endereco;document.getElementById("f_contato").value=m.contato||"";document.getElementById("f_end").value=m.endereco||"";drawHist(m);} });
  document.getElementById("f_contato").addEventListener("input",e=>form.contato=e.target.value);
  document.getElementById("f_end").addEventListener("input",e=>form.endereco=e.target.value);
  if(form.clienteId){const m=S.clientes.find(c=>c.id===form.clienteId);if(m)drawHist(m);}

  // wire receita
  document.querySelectorAll(".rxi").forEach(i=>i.addEventListener("input",e=>{
    form.rx[e.target.dataset.eye][e.target.dataset.f]=e.target.value; liveRxValidate();}));
  // medidas
  document.querySelectorAll(".md").forEach(i=>i.addEventListener("input",e=>form.medidas[e.target.dataset.k]=e.target.value));
  // produto
  document.getElementById("p_arm").addEventListener("input",e=>form.produto.armacao=e.target.value);
  document.getElementById("p_tipo").addEventListener("change",e=>form.produto.tipo=e.target.value);
  document.getElementById("p_ind").addEventListener("change",e=>form.produto.indice=e.target.value);
  document.getElementById("p_valor").addEventListener("input",e=>form.valor=e.target.value);
  document.getElementById("p_obs").addEventListener("input",e=>form.produto.obs=e.target.value);
  document.querySelectorAll("#tratChips .chip").forEach(ch=>ch.addEventListener("click",()=>{
    const t=ch.dataset.t;const i=form.produto.tratam.indexOf(t);
    if(i>=0)form.produto.tratam.splice(i,1);else form.produto.tratam.push(t);ch.classList.toggle("on");}));
  document.getElementById("consentChk").addEventListener("change",e=>form.consent=e.target.checked);
  document.getElementById("saveBtn").onclick=()=>saveOrdem(false);
  document.getElementById("savePrintBtn").onclick=()=>saveOrdem(true);
  if(editingId)document.getElementById("cancelEdit").onclick=()=>{editingId=null;form=newForm();nav("atend");};
}

function drawHist(cli){
  const box=document.getElementById("histBox");if(!box)return;
  const prev=S.ordens.filter(o=>o.clienteId===cli.id).sort((a,b)=>b.data.localeCompare(a.data));
  if(!prev.length){box.innerHTML="";return;}
  const last=prev[0];const r=last.receita;
  box.innerHTML=`<div style="margin-top:13px;background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:12px">
    <b style="color:var(--acc-d)">Histórico — última OS ${brDate(last.data)}</b>
    <div style="font-family:var(--mono);margin-top:5px;color:var(--mut)">
      OD ${rxLine(r.od)} · OE ${rxLine(r.oe)}</div>
    <button class="icobtn" id="copyRx" style="margin-top:9px">Copiar receita anterior</button></div>`;
  document.getElementById("copyRx").onclick=()=>{form.rx=JSON.parse(JSON.stringify(last.receita));drawAtend();};
}
function rxLine(e){return `${e.esf||"—"} ${e.cil||""} ${e.eixo?"x"+e.eixo:""} ${e.ad?"add "+e.ad:""}`.trim();}

function liveRxValidate(){
  const errs=validRx(form.rx);
  document.querySelectorAll(".rxi").forEach(i=>i.classList.toggle("bad",!!errs[i.dataset.eye+i.dataset.f]));
  const msgs=Object.entries(errs).map(([k,val])=>k.slice(0,2).toUpperCase()+" "+k.slice(2)+": "+val);
  document.getElementById("rxErr").textContent=msgs.join("  ·  ");
  return Object.keys(errs).length===0;
}

function saveOrdem(printAfter){
  if(!form.nome.trim()){toast("Informe o nome do cliente.");return;}
  if(!liveRxValidate()){toast("Corrija a receita antes de salvar.");return;}
  if(!form.consent){toast("Marque o consentimento LGPD para salvar.");return;}
  // upsert cliente
  let cli=form.clienteId?S.clientes.find(c=>c.id===form.clienteId):null;
  if(!cli){cli=S.clientes.find(c=>c.nome.toLowerCase()===form.nome.trim().toLowerCase());}
  if(cli){cli.nome=form.nome.trim();cli.contato=form.contato;cli.endereco=form.endereco;}
  else{cli={id:uid(),nome:form.nome.trim(),contato:form.contato,endereco:form.endereco};S.clientes.push(cli);}

  let ordem;
  if(editingId){
    ordem=S.ordens.find(o=>o.id===editingId);
    ordem.clienteId=cli.id;ordem.receita=form.rx;ordem.medidas=form.medidas;
    ordem.produto={armacao:form.produto.armacao,tipo:form.produto.tipo,indice:form.produto.indice,tratam:form.produto.tratam,obs:form.produto.obs};
    ordem.valor=form.valor;ordem.status=form.status;
    toast("OS atualizada.");
  }else{
    ordem={id:uid(),osGlobal:S.counters.global,osLocal:S.counters.local,clienteId:cli.id,data:today(),
      receita:form.rx,medidas:form.medidas,
      produto:{armacao:form.produto.armacao,tipo:form.produto.tipo,indice:form.produto.indice,tratam:form.produto.tratam,obs:form.produto.obs},
      valor:form.valor,status:form.status,consent:{aceito:true,data:new Date().toISOString()}};
    S.ordens.push(ordem);
    S.counters.global++;S.counters.local++;
    toast(fmtG(ordem.osGlobal)+" criada.");
  }
  persist();
  const savedId=ordem.id;editingId=null;form=newForm();
  if(printAfter){printOrdem(savedId,"os");}
  nav("ordens");
}

/* ---------- ORDENS ---------- */
function drawOrdens(){
  const v=document.getElementById("view");
  const list=[...S.ordens].sort((a,b)=>b.osGlobal-a.osGlobal);
  v.innerHTML=`<input class="search" id="ordSearch" placeholder="Buscar por cliente ou número">
    <div class="ordens" id="ordList"></div>`;
  const render=(q="")=>{
    const box=document.getElementById("ordList");
    const f=list.filter(o=>{const c=S.clientes.find(x=>x.id===o.clienteId)||{};
      const s=(c.nome+" "+fmtG(o.osGlobal)+" #"+o.osLocal).toLowerCase();return s.includes(q.toLowerCase());});
    if(!f.length){box.innerHTML='<div class="empty">Nenhuma ordem ainda. Comece um atendimento.</div>';return;}
    box.innerHTML="";
    f.forEach(o=>{
      const c=S.clientes.find(x=>x.id===o.clienteId)||{nome:"—"};
      const el=document.createElement("div");el.className="ord";
      el.innerHTML=`<div><div class="id">${fmtG(o.osGlobal)} <span class="loc">· sua #${o.osLocal}</span></div>
        <div class="nm">${esc(c.nome)}</div>
        <div class="meta">${brDate(o.data)} · ${esc(o.produto.tipo||"lente")} ${esc(o.produto.indice||"")}</div></div>
        <div class="ctrl">
          <select class="status" data-s="${o.status}">${STATUS.map(([k,l])=>`<option value="${k}" ${o.status===k?"selected":""}>${l}</option>`).join("")}</select>
          <button class="icobtn" data-a="os">OS</button>
          <button class="icobtn" data-a="recibo">recibo</button>
          <button class="icobtn" data-a="edit">editar</button>
          <button class="icobtn del" data-a="del">×</button>
        </div>`;
      el.querySelector(".status").addEventListener("change",e=>{o.status=e.target.value;e.target.dataset.s=e.target.value;persist();});
      el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
        const a=b.dataset.a;
        if(a==="os")printOrdem(o.id,"os");
        else if(a==="recibo")printOrdem(o.id,"recibo");
        else if(a==="edit")loadOrdemToForm(o);
        else if(a==="del"){if(confirm("Excluir "+fmtG(o.osGlobal)+"?")){S.ordens=S.ordens.filter(x=>x.id!==o.id);persist();drawOrdens();}}
      });
      box.appendChild(el);
    });
  };
  render();
  document.getElementById("ordSearch").addEventListener("input",e=>render(e.target.value));
}

/* ---------- FERRAMENTAS: transposição ---------- */
function drawFerr(){
  const v=document.getElementById("view");
  v.innerHTML=`<div class="card">
    <h2>Transposição de eixo/cilíndrico</h2>
    <p class="hint">Converte a notação (positiva ↔ negativa) quando a lente tem limite de faixa por sinal. Cálculo na hora do atendimento.</p>
    <div class="grid g3">
      <label class="f">Esférico<input class="num" id="t_esf" inputmode="decimal" placeholder="±0.00"></label>
      <label class="f">Cilíndrico<input class="num" id="t_cil" inputmode="decimal" placeholder="±0.00"></label>
      <label class="f">Eixo<input class="num" id="t_eixo" inputmode="numeric" placeholder="0–180"></label>
    </div>
    <div class="actions" style="margin-top:14px"><button class="btn pri" id="t_go">Transpor</button></div>
    <div class="tout" id="t_out"></div>
  </div>`;
  document.getElementById("t_go").onclick=()=>{
    const esf=parseFloat(document.getElementById("t_esf").value);
    const cil=parseFloat(document.getElementById("t_cil").value);
    const eixo=parseInt(document.getElementById("t_eixo").value);
    const out=document.getElementById("t_out");
    if(isNaN(esf)||isNaN(cil)||isNaN(eixo)||eixo<0||eixo>180){out.className="tout show";out.innerHTML="Preencha os três campos com valores válidos (eixo 0–180).";return;}
    const nEsf=(esf+cil), nCil=-cil; let nEixo=eixo+90; if(nEixo>180)nEixo-=90*2>0?90:0; nEixo=(eixo+90)%180; if(nEixo===0)nEixo=180;
    const sg=n=>(n>0?"+":"")+n.toFixed(2);
    out.className="tout show";
    out.innerHTML=`Original: <b>${sg(esf)} ${sg(cil)} x ${eixo}°</b><br>Transposta: <b>${sg(nEsf)} ${sg(nCil)} x ${nEixo}°</b>`;
  };
}

  v.innerHTML=`<div class="card">
    <h2>Dados do consultor (MEI)</h2>
    <p class="hint">Aparecem na OS impressa como identificação formal. O cliente do laboratório é você — a ferramenta só gera o documento.</p>
    <div class="grid g2">
      <label class="f">Nome / razão<input id="c_nome" value="${esc(S.config.nome)}"></label>
      <label class="f">CNPJ<input id="c_cnpj" value="${esc(S.config.cnpj)}" placeholder="00.000.000/0001-00"></label>
    </div>
  </div>
  <div class="card">
    <h2>Numeração local</h2>

/* ---------- PRINT ---------- */
function printOrdem(id,mode){
  const o=S.ordens.find(x=>x.id===id);if(!o)return;
  const c=S.clientes.find(x=>x.id===o.clienteId)||{};
  const rxRow=e=>`<tr><th>${e}</th><td>${sgv(o.receita[e.toLowerCase()].esf)}</td><td>${sgv(o.receita[e.toLowerCase()].cil)}</td><td>${o.receita[e.toLowerCase()].eixo||"—"}</td><td>${o.receita[e.toLowerCase()].ad?sgv(o.receita[e.toLowerCase()].ad):"—"}</td></tr>`;
  const trat=o.produto.tratam&&o.produto.tratam.length?o.produto.tratam.join(", "):"—";
  const title=mode==="recibo"?"Recibo / Orçamento":"Ordem de Serviço";
  const valorBlock=(mode==="recibo")?`<h3>Valor</h3><div class="prod" style="font-size:16px"><b>${o.valor?("R$ "+esc(o.valor)):"—"}</b></div>`:"";
  const medidas=`DNP OD ${o.medidas.dnpOD||"—"} / OE ${o.medidas.dnpOE||"—"} mm · Altura OD ${o.medidas.altOD||"—"} / OE ${o.medidas.altOE||"—"} mm`;
  document.getElementById("printDoc").innerHTML=`
   <div class="doc">
     <div class="dh">
       <div class="cnpj"><small>CNPJ MEI</small>${esc(S.config.cnpj||"—")}<div style="font-size:11px;font-weight:400">${esc(S.config.nome||"")}</div></div>
       <div class="nums"><small>${title}</small><b>${fmtG(o.osGlobal)}</b><br>sua ref. #${o.osLocal}<br>${brDate(o.data)}</div>
     </div>
     <h3>Cliente</h3>
     <div class="cli"><b>${esc(c.nome)}</b><br>${esc(c.contato||"")}${c.endereco?" · "+esc(c.endereco):""}</div>
     <h3>Receita</h3>
     <table class="rxp"><thead><tr><th></th><th>Esf.</th><th>Cil.</th><th>Eixo</th><th>Adição</th></tr></thead>
       <tbody>${rxRow("OD")}${rxRow("OE")}</tbody></table>
     <div class="cli" style="margin-top:5px;font-size:11px">${medidas}</div>
     <h3>Produto</h3>
     <div class="prod">Armação: ${esc(o.produto.armacao||"—")}<br>
       Lente: ${esc(o.produto.tipo||"—")} · ${esc(o.produto.indice||"—")} · tratamentos: ${esc(trat)}<br>
       ${o.produto.obs?"Obs.: "+esc(o.produto.obs):""}</div>
     ${valorBlock}
     <div class="foot"><span>Status: ${esc((STATUS.find(s=>s[0]===o.status)||["",""])[1])}</span><span>Consentimento LGPD registrado</span></div>
     <div class="sign">assinatura do cliente</div>
   </div>`;
  setTimeout(()=>window.print(),60);
}
function sgv(x){if(x===""||x==null)return"—";const n=parseFloat(x);if(isNaN(n))return esc(x);return(n>0?"+":"")+n.toFixed(2);}

/* ---------- boot ---------- */
function paintWho(){document.getElementById("whoName").textContent=S.config.nome||"Configure o MEI";
  document.getElementById("whoCnpj").textContent=S.config.cnpj||"";}
function draw(){
  if(current==="atend")drawAtend();
  else if(current==="ordens")drawOrdens();
  else if(current==="ferr")drawFerr();
  else if(current==="cfg")drawCfg();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>nav(b.dataset.t));
(async()=>{await load();paintWho();
  if(!S.config.nome){current="cfg";document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==="cfg"));}
  draw();})();
</script>
